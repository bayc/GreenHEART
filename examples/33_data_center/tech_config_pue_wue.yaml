name: technology_config
description: Data center using PUE (Power Usage Effectiveness) and WUE (Water Usage Effectiveness) metrics
technologies:
  water_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    cost_model:
      model: FeedstockCostModel
    model_inputs:
      shared_parameters:
        commodity: water
        commodity_rate_units: galUS/h
      performance_parameters:
        rated_capacity: 1.e6  # galUS/h
      cost_parameters:
        cost_year: 2026
        price: 0.001  # $/galUS
        annual_cost: 0.
        start_up_cost: 0.
  data_center_pue_wue:
    performance_model:
      model: DataCenterPUEWUEPerformanceModel
    cost_model:
      model: DataCenterPUEWUECostModel
    model_inputs:
      shared_parameters:
        system_capacity_mw: 100.  # IT equipment capacity in MW
      performance_parameters:
        pue: 1.5  # Power Usage Effectiveness (typical: 1.1-2.5)
        wue: 0.7  # Water Usage Effectiveness in L/kWh (typical: 0.3-2.0)
        compute_it_workload_profile: 80.0  # MW (constant load, can be array)
      cost_parameters:
        electricity_rate: 0.04574  # $/kWh
        water_rate: 0.01  # $/gallon
        capex_per_mw: 4.0625e6 #1.0e6  # $/MW of IT capacity
        fixed_opex_per_mw_per_year: 5.0e4  # $/MW/year
        cost_year: 2026
  grid_buy:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1.e6  # kW
      cost_parameters:
        cost_year: 2026
        electricity_buy_price: 0.0  # Will use tech costs instead
        interconnection_capex_per_kw: 0.0  # $/kW capital cost
        interconnection_opex_per_kw: 0.0  # $/kW/year O&M cost
        fixed_interconnection_cost: 0.0  # $ one-time fixed cost
